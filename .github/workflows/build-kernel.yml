name: Build Mainline Kernel for Motorola Kiev

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/kiev_defconfig'
      - 'dts/sm7225-motorola-kiev.dts'
      - '.github/workflows/build-kernel.yml'
  pull_request:
    paths:
      - 'config/kiev_defconfig'
      - 'dts/sm7225-motorola-kiev.dts'
      - '.github/workflows/build-kernel.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout kiev-mainline
        uses: actions/checkout@v4
        with:
          path: kiev-mainline

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            llvm \
            libssl-dev \
            bc \
            cpio \
            kmod \
            flex \
            bison \
            dwarves \
            python3 \
            git \
            wget

      - name: Clone Linux mainline (v7.0)
        run: |
          git clone --depth=1 --branch v7.0 \
            https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git \
            linux-mainline

      - name: Copy config and device tree
        run: |
          cp kiev-mainline/config/kiev_defconfig linux-mainline/arch/arm64/configs/
          cp kiev-mainline/dts/sm7225-motorola-kiev.dts linux-mainline/arch/arm64/boot/dts/qcom/
          echo 'dtb-$(CONFIG_ARCH_QCOM)	+= sm7225-motorola-kiev.dtb' >> linux-mainline/arch/arm64/boot/dts/qcom/Makefile

      - name: Configure kernel
        run: |
          cd linux-mainline
          make ARCH=arm64 LLVM=1 kiev_defconfig

      - name: Build DTB
        run: |
          cd linux-mainline
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 DTC_FLAGS="-@" \
            arch/arm64/boot/dts/qcom/sm7225-motorola-kiev.dtb

      - name: Build Kernel Image.gz
        run: |
          cd linux-mainline
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 DTC_FLAGS="-@" -j$(nproc) Image.gz

      - name: Verify outputs
        run: |
          ls -la linux-mainline/arch/arm64/boot/Image.gz
          ls -la linux-mainline/arch/arm64/boot/dts/qcom/sm7225-motorola-kiev.dtb

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiev-kernel-${{ github.sha }}
          path: |
            linux-mainline/arch/arm64/boot/Image.gz
            linux-mainline/arch/arm64/boot/dts/qcom/sm7225-motorola-kiev.dtb
          retention-days: 30

      - name: Create release on tag push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            linux-mainline/arch/arm64/boot/Image.gz
            linux-mainline/arch/arm64/boot/dts/qcom/sm7225-motorola-kiev.dtb
          generate_release_notes: true